name: Ben
options:
  bundleIdPrefix: com.repertoirestudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.43.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "4CGY239475"  # Repertoire Studio Pty Ltd
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # HUMAN: RevenueCat API key — set locally, never commit. Empty means purchases
    # throw notConfigured until Luke pastes the appl_ key into Secrets.xcconfig.
    REVENUECAT_API_KEY: ""
targets:
  Ben:
    type: application
    platform: iOS
    sources:
      - path: Ben
        excludes:
          - "StoreKit/**"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    info:
      path: Ben/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Ben
        ITSAppUsesNonExemptEncryption: false
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        UIAppFonts:
          - Baloo2-Variable.ttf
          - Figtree-Variable.ttf
        NSCameraUsageDescription: "Ben uses the camera to read your bill so you don't have to type it."
        NSPhotoLibraryUsageDescription: "Ben reads bill photos you choose so you don't have to type them."
        UIBackgroundModes: []
    settings:
      base:
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.repertoirestudio.Ben
        CODE_SIGN_STYLE: Automatic
  BenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BenTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
  BenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BenUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
schemes:
  Ben:
    build:
      targets:
        Ben: all
    test:
      targets: [BenTests, BenUITests]
    storeKitConfiguration: Ben/StoreKit/BenProducts.storekit
