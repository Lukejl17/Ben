name: Ben
options:
  bundleIdPrefix: com.repertoirestudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""   # HUMAN: set team ID for device builds; simulator works without
targets:
  Ben:
    type: application
    platform: iOS
    sources: [Ben]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    info:
      path: Ben/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Ben
        UIAppFonts:
          - Baloo2-Variable.ttf
          - Figtree-Variable.ttf
        NSCameraUsageDescription: "Ben uses the camera to read your bill so you don't have to type it."
        NSPhotoLibraryUsageDescription: "Ben reads bill photos you choose so you don't have to type them."
        UIBackgroundModes: []
        # Firebase Google sign-in calls back into the app on REVERSED_CLIENT_ID.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1003553134186-qb4b4len15l62u6tq2ahi69fof7mpgrm
    settings:
      base:
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  BenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BenTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
  BenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BenUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
schemes:
  Ben:
    build:
      targets:
        Ben: all
    test:
      targets: [BenTests, BenUITests]
