name: Ben
options:
  bundleIdPrefix: com.repertoirestudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.16.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.43.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "4CGY239475"  # Repertoire Studio Pty Ltd
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Ben:
    type: application
    platform: iOS
    sources:
      - path: Ben
        excludes:
          - "StoreKit/**"
      - path: BenShared
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
      - target: BenWidgets
    info:
      path: Ben/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Ben
        # Skip export-compliance quiz on each upload (HTTPS-only / OS encryption).
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        REVENUECAT_API_KEY: ""
        UIAppFonts:
          - Baloo2-Variable.ttf
          - Figtree-Variable.ttf
        NSCameraUsageDescription: "Ben uses the camera to read your bill so you don't have to type it."
        NSPhotoLibraryUsageDescription: "Ben reads bill photos you choose so you don't have to type them."
        UIBackgroundModes: []
        # Firebase Google sign-in + Live Activity deep links (ben://bill/<id>).
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1003553134186-qb4b4len15l62u6tq2ahi69fof7mpgrm
              - ben
    settings:
      base:
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Ben/Ben.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.repertoirestudio.Ben
  BenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BenWidgets
      - path: BenShared
    info:
      path: BenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ben
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repertoirestudio.Ben.BenWidgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  BenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BenTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
  BenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BenUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ben
schemes:
  Ben:
    build:
      targets:
        Ben: all
        BenWidgets: all
    test:
      targets: [BenTests, BenUITests]
    storeKitConfiguration: Ben/StoreKit/BenProducts.storekit
